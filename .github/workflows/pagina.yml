# Publica a página "ajudar pelo navegador" (navegador/) no GitHub Pages: comite-popular-tech.github.io/videos-territorios/
# Roda a cada push em master que mexe em navegador/ e quando disparada à mão (Actions → pagina → Run workflow).
name: pagina

on:
  push:
    branches: [master]
    paths: ['navegador/**', '.github/workflows/pagina.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: navegador/package-lock.json
      - run: npm ci && npm run build
        working-directory: navegador
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: navegador/dist
      - id: deploy
        uses: actions/deploy-pages@v4
