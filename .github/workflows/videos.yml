# Renderiza os vídeos de Saúde (video/) em várias máquinas do GitHub Actions ao mesmo tempo.
# Dispare em Actions → videos → Run workflow **num fork** (conta pessoal ou org só sua): o limite de 20 máquinas do
# plano Free é por conta, e rodar aqui ocupa as 20 da org e trava o CI dos outros repositórios. Neste repositório o
# render recusa rodar; só o kit de exemplo é permitido, para testar o workflow. Cada máquina roda video/ajudar.sh, que
# pede lotes de territórios à fila (Worker público, entrada fila_url), renderiza, sobe os MP4 e para quando a fila
# esvazia. Com `exemplo` marcado, renderiza só o kit de exemplo (4 territórios) e sobe os MP4 como artifact: teste.
name: videos

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Máquinas em paralelo (o GitHub dá até 20)'
        type: number
        default: 20
      limite:
        description: 'Territórios por máquina (0 = até a fila esvaziar)'
        type: number
        default: 0
      conc:
        description: 'Abas do Chrome por vídeo (o runner tem 4 vCPU)'
        type: number
        default: 4
      sem_voz:
        description: 'Sem locução (só para testar o render)'
        type: boolean
        default: false
      trabalho:
        description: 'Trabalhos da fila, na ordem, separados por vírgula (esvaziou um, segue o próximo)'
        type: string
        default: video-saude,video-mcmv,video-postonovo
      fila_url:
        description: 'URL do Worker da fila'
        type: string
        default: 'https://fila-videos.boralula.workers.dev'
      exemplo:
        description: 'Só o kit de exemplo (4 territórios, sem fila; MP4 saem como artifact)'
        type: boolean
        default: false

# Roda igual num fork de voluntário: não precisa de segredo, não escreve no repositório, só lê o código.
permissions:
  contents: read

jobs:
  matriz:
    runs-on: ubuntu-latest
    # Na org, só o kit de exemplo: o render de verdade ocuparia as 20 máquinas da comite-popular-tech inteira.
    if: inputs.exemplo || github.repository_owner != 'comite-popular-tech'
    outputs:
      lista: ${{ steps.m.outputs.lista }}
    steps:
      - id: m
        run: echo "lista=$(node -e 'console.log(JSON.stringify(Array.from({length:+process.argv[1]},(_,i)=>i+1)))' '${{ inputs.jobs }}')" >> "$GITHUB_OUTPUT"

  render:
    needs: matriz
    runs-on: ubuntu-latest
    timeout-minutes: 350   # o Actions corta em 6 h
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.matriz.outputs.lista) }}
    env:
      FILA_URL: ${{ inputs.fila_url || vars.FILA_URL || 'https://fila-videos.boralula.workers.dev' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.trabalho == 'video-bolsa-familia' && 22 || 20 }}   # o HyperFrames pede Node 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache do node_modules (inclui o Chrome do Remotion) e do Chromium do Playwright
        if: inputs.trabalho != 'video-pedemeia'
        uses: actions/cache@v4
        with:
          path: |
            video/node_modules
            .cache/ms-playwright
          key: video-${{ runner.os }}-${{ hashFiles('video/package.json') }}

      - name: Dependências
        working-directory: video
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          if [ "${{ inputs.trabalho }}" = "video-pedemeia" ]; then   # só Python + ffmpeg: sem Remotion nem navegador
            pip install --quiet edge-tts pillow
            exit 0
          fi
          npm install --no-audit --no-fund
          npx remotion browser ensure
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }   # video-insulina: aceleração e música no fim
          npx playwright install --with-deps chromium
          pip install --quiet edge-tts numpy
          python trilha.py
          if [ "${{ inputs.trabalho }}" = "video-bolsa-familia" ]; then npx hyperframes browser ensure; fi   # render do HyperFrames

      - name: Render
        env:
          TRABALHO: ${{ inputs.trabalho || 'video-saude' }}
          LIMITE: ${{ inputs.limite || 0 }}
          CONC: ${{ inputs.conc || 4 }}
          SEM_VOZ: ${{ inputs.sem_voz && '--sem-voz' || '' }}
          EXEMPLO: ${{ inputs.exemplo }}
          QUEM: actions-${{ github.repository_owner }}-${{ matrix.n }}
        run: |
          if [ "$EXEMPLO" = "true" ]; then
            cd video && node lote.mjs --exemplo --todas --gl swangle --conc "$CONC" $SEM_VOZ
          else
            LIM=""; [ "$LIMITE" -gt 0 ] && LIM="--limite $LIMITE"
            bash video/ajudar.sh --trabalho "$TRABALHO" --quem "$QUEM" $LIM --gl swangle --conc "$CONC" $SEM_VOZ
          fi

      - name: Tempo por vídeo
        if: always()
        run: |
          if [ -f video/lote-relatorio.csv ]; then
            { echo '### Relatório do lote (máquina ${{ matrix.n }})'; echo; echo '```'; cat video/lote-relatorio.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vídeos do kit de exemplo
        if: always() && inputs.exemplo
        uses: actions/upload-artifact@v4
        with:
          name: videos-exemplo-${{ matrix.n }}
          path: |
            saida/territorios/*/video/saude.mp4
            video/lote-relatorio.csv
          if-no-files-found: warn
